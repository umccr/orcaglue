config:
  aws:region: ap-southeast-2
  # Format: <current-project-name>:<key-name>: organization/<target-project>/<target-stack>
  spreadsheet-ica-usage-report:shared-infra: organization/shared-infra/prod
  spreadsheet-ica-usage-report:requirements: ../requirements.txt
  spreadsheet-ica-usage-report:job-script: job/spreadsheet_ica_usage_report.py
  spreadsheet-ica-usage-report:lz-bucket: orcahouse-prod-landing-zone-115253169271-ap-southeast-2-an
  spreadsheet-ica-usage-report:rs-workgroup: orcahouse-prod
  spreadsheet-ica-usage-report:rs-role: arn:aws:iam::115253169271:role/prod-redshift-namespace-role
  # This is the source data prefix used by the legacy OrcaHouse job.
  # Change it only if the ICA reports are copied to a new prefix.
  spreadsheet-ica-usage-report:source-prefix: ica-usage-reports/
  # Keep the trigger off until a manual prod run has been validated.
  spreadsheet-ica-usage-report:trigger-enabled: "false"
  # 13:40 UTC = AEST/AEDT 00:40 AM. Staggered behind the other ETL modules.
  spreadsheet-ica-usage-report:schedule: cron(40 13 * * ? *)
