config:
  aws:region: ap-southeast-2
  # Format: <current-project-name>:<key-name>: organization/<target-project>/<target-stack>
  spreadsheet-google-lims:shared-infra: organization/shared-infra/prod
  spreadsheet-google-lims:requirements: ../requirements.txt
  spreadsheet-google-lims:job-script: job/spreadsheet_google_lims.py
  spreadsheet-google-lims:lz-bucket: orcahouse-prod-landing-zone-115253169271-ap-southeast-2-an
  spreadsheet-google-lims:rs-workgroup: orcahouse-prod
  spreadsheet-google-lims:rs-role: arn:aws:iam::115253169271:role/prod-redshift-namespace-role
  # Keep the trigger off until a manual prod run has been validated.
  spreadsheet-google-lims:trigger-enabled: "false"
  # 13:10 UTC = AEST/AEDT 00:10 AM. Staggered against the other ETL modules.
  spreadsheet-google-lims:schedule: cron(10 13 * * ? *)
