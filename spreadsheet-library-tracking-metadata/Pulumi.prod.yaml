config:
  aws:region: ap-southeast-2
  # Format: <current-project-name>:<key-name>: organization/<target-project>/<target-stack>
  spreadsheet-library-tracking-metadata:shared-infra: organization/shared-infra/prod
  spreadsheet-library-tracking-metadata:requirements: ../requirements.txt
  spreadsheet-library-tracking-metadata:job-script: job/spreadsheet_library_tracking_metadata.py
  spreadsheet-library-tracking-metadata:lz-bucket: orcahouse-prod-landing-zone-115253169271-ap-southeast-2-an
  spreadsheet-library-tracking-metadata:rs-workgroup: orcahouse-prod
  spreadsheet-library-tracking-metadata:rs-role: arn:aws:iam::115253169271:role/prod-redshift-namespace-role
  # Keep the trigger off until a manual prod run has been validated.
  spreadsheet-library-tracking-metadata:trigger-enabled: "false"
  # 13:25 UTC = AEST/AEDT 00:25 AM. Staggered against the other ETL modules.
  spreadsheet-library-tracking-metadata:schedule: cron(25 13 * * ? *)
