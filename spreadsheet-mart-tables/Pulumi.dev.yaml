config:
  aws:region: ap-southeast-2
  # Format: <current-project-name>:<key-name>: organization/<target-project>/<target-stack>
  spreadsheet-mart-tables:shared-infra: organization/shared-infra/dev
  # The job's own pinned wheels, not the shared requirements.txt. Run `make wheels` before `pulumi up`.
  spreadsheet-mart-tables:requirements: job/requirements.txt
  spreadsheet-mart-tables:job-script: job/spreadsheet_mart_tables.py
  spreadsheet-mart-tables:rds-ca-bundle: job/rds-ca-ap-southeast-2-bundle.pem
  spreadsheet-mart-tables:lz-bucket: orcahouse-dev-landing-zone-115253169271-ap-southeast-2-an
  # The Redshift UNLOAD target. See the Input Contract in the README.
  spreadsheet-mart-tables:source-bucket: orcavault-dev-warehouse-115253169271-ap-southeast-2-an
  spreadsheet-mart-tables:source-prefix: v1/csv/mart/
  spreadsheet-mart-tables:aurora-cluster: orcanexus-dev
  spreadsheet-mart-tables:aurora-database: orcanexus
  # Created with rds_iam by orcahouse infra/aurora/dba/04_rw.sql.
  spreadsheet-mart-tables:aurora-user: dbuser_rw
  # The UomPrimaryVpc private subnet for the Glue network connection, in the Aurora writer's AZ.
  spreadsheet-mart-tables:glue-subnet: UomPrimaryPrivateSubnetA
  # Keep in sync with MART_TABLES_DEFAULT and job/init.sql.
  spreadsheet-mart-tables:mart-tables: bam,em_library_aliases,em_library_dns,em_library_services,fastq,lims,vcf,workflow,workflow_cost_report,workflow_output
  # Triggers are opt-in. Leave false until the Redshift UNLOAD is scheduled and a manual run is validated.
  spreadsheet-mart-tables:trigger-enabled: "false"
  # 18:00 UTC = 04:00 AEST / 05:00 AEDT. A placeholder, to be set after the UNLOAD schedule.
  spreadsheet-mart-tables:schedule: cron(0 18 * * ? *)
